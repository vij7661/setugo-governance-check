name: External Governance Qualification

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character candidate SHA from setugo-ai-development-framework
        required: true
        type: string

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    environment: governance-app-publisher
    steps:
      - name: Checkout external checker
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate checker ref and candidate SHA
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          printf 'checker_sha=%s\n' "$GITHUB_SHA"

      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ secrets.SETUGO_GOVERNANCE_APP_ID }}
          private-key: ${{ secrets.SETUGO_GOVERNANCE_APP_PRIVATE_KEY }}
          owner: vij7661
          repositories: setugo-ai-development-framework

      - name: Run external falsifier
        id: falsify
        continue-on-error: true
        shell: bash
        env:
          GOVERNANCE_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          python checker/falsify_candidate_entry.py \
            --repo vij7661/setugo-ai-development-framework \
            --sha '${{ inputs.candidate_sha }}' | tee result.json

      - name: Publish external qualification check
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SHA: ${{ inputs.candidate_sha }}
          STEP_OUTCOME: ${{ steps.falsify.outcome }}
          CHECKER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$STEP_OUTCOME" == "success" ]]; then
            CONCLUSION=success
            TITLE='External governance falsification passed (evidence only)'
            SUMMARY="External checker ${CHECKER_SHA} completed frozen TESTING qualification attacks. Evidence only; no terminal authority."
          else
            CONCLUSION=failure
            TITLE='External governance falsification failed closed'
            SUMMARY="External checker ${CHECKER_SHA} found at least one failed invariant. TESTING remains blocked; no terminal authority."
          fi

          jq -n \
            --arg name 'external-governance-qualification' \
            --arg head_sha "$SHA" \
            --arg external_id "$CHECKER_SHA" \
            --arg conclusion "$CONCLUSION" \
            --arg title "$TITLE" \
            --arg summary "$SUMMARY" \
            '{name:$name, head_sha:$head_sha, external_id:$external_id, status:"completed", conclusion:$conclusion, output:{title:$title, summary:$summary}}' \
            > check.json

          curl --fail-with-body -sS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/vij7661/setugo-ai-development-framework/check-runs \
            -d @check.json

      - name: Fail workflow when falsification failed
        if: steps.falsify.outcome != 'success'
        run: exit 1
