name: RELEASE R3 Policy Binding Preflight

on:
  push:
    branches:
      - release/r3-merge-authority-gate

permissions:
  contents: read

jobs:
  policy-binding:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout checker branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Derive exact candidate policy binding
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE=6d4fbb9ce266979ca3147a159ae724f33e0362ba
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          git clone --filter=blob:none --no-checkout https://github.com/vij7661/setugo-ai-development-framework.git "$TMP/candidate"
          git -C "$TMP/candidate" fetch --depth=1 origin "$CANDIDATE"
          git -C "$TMP/candidate" checkout --detach "$CANDIDATE"
          test "$(git -C "$TMP/candidate" rev-parse HEAD)" = "$CANDIDATE"
          cd "$TMP/candidate/governance-runtime"
          python -I - <<'PY'
          import json, pathlib, sys
          runtime = pathlib.Path('.').resolve()
          sys.path.append(str(runtime))
          import qualification_boundary_policy as p
          print('POLICY_BINDING=' + json.dumps(p.policy_binding(), sort_keys=True, separators=(',', ':')))
          PY
