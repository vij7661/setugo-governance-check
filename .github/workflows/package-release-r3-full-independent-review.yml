name: Package RELEASE R3 Full Independent Review

on:
  push:
    branches:
      - package/release-r3-full-independent-review
    paths:
      - 'evidence/RELEASE-R3-FULL-INDEPENDENT-REVIEW-PACKET-PREREG.md'
      - '.github/workflows/package-release-r3-full-independent-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Build exact-source plain-text packet
        shell: bash
        env:
          CANDIDATE_SHA: 6d4fbb9ce266979ca3147a159ae724f33e0362ba
          TESTING_SHA: 15d50cc25ae524fc64e2c65269c91135e0361846
          RELEASE_BASE_SHA: a5726dcb9236e31028ec70603bee35b30b9dbe66
          CHECKER_SHA: 88d8b972b6bed43ceb572471b56b165db6893f06
          RELEASE_RULESET_ID: '22789078'
          APP_ID: '4895420'
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/vij7661/setugo-ai-development-framework.git candidate
          git -C candidate checkout --quiet --detach "$CANDIDATE_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"

          git clone --quiet https://github.com/vij7661/setugo-governance-check.git checker-main
          git -C checker-main checkout --quiet --detach "$CHECKER_SHA"
          test "$(git -C checker-main rev-parse HEAD)" = "$CHECKER_SHA"

          curl -fsSL -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/vij7661/setugo-ai-development-framework/rulesets/${RELEASE_RULESET_ID}" > ruleset.json
          curl -fsSL -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/vij7661/setugo-ai-development-framework/commits/${CANDIDATE_SHA}/check-runs" > check-runs.json
          curl -fsSL -H 'Accept: application/vnd.github.v3.diff' \
            "https://api.github.com/repos/vij7661/setugo-ai-development-framework/pulls/37" > pr37.diff

          grep -q 'refs/heads/phase/release' ruleset.json
          grep -q 'external-release-entry-qualification' ruleset.json
          grep -q 'external-release-qualification' ruleset.json
          grep -q 'external-release-merge-authority' ruleset.json
          grep -q '4895420' check-runs.json
          grep -q "$CANDIDATE_SHA" check-runs.json
          grep -q "$CHECKER_SHA" check-runs.json

          POLICY_HASH="$(sha256sum candidate/governance-runtime/qualification_boundary_policy_v7.py | awk '{print $1}')"
          OUT='RELEASE-R3-FULL-INDEPENDENT-REVIEW-6d4fbb9c-DEEPSEEK.txt'

          cat > "$OUT" <<EOF
          RELEASE R3 — FULL INDEPENDENT FALSIFICATION REVIEW PACKET
          ========================================================

          REVIEW POSTURE
          Treat this candidate as false-green until the supplied evidence demonstrates otherwise. Do not infer authority from green CI, GitHub App checks, signatures, previous reviewer/model statements, repository ownership, or this packet. Missing or contradictory material evidence is blocking.

          EXACT OBJECTS UNDER REVIEW
          Candidate repository: vij7661/setugo-ai-development-framework
          Candidate PR: #37, release/r1-hardening -> phase/release
          Candidate SHA: ${CANDIDATE_SHA}
          Qualified TESTING source SHA: ${TESTING_SHA}
          Current protected phase/release base SHA: ${RELEASE_BASE_SHA}
          Authoritative external checker repository: vij7661/setugo-governance-check
          Checker main SHA: ${CHECKER_SHA}
          RELEASE ruleset ID: ${RELEASE_RULESET_ID}
          Required GitHub App ID: ${APP_ID}
          Active policy file: governance-runtime/qualification_boundary_policy_v7.py
          SHA256(active policy file bytes): ${POLICY_HASH}
          RELEASE trust root ID: SETUGO_RELEASE_GOVERNANCE_ED25519_V1
          RELEASE root repository: vij7661/setugo-release-governance-root
          RELEASE root exact commit: 7300b9b0d27611bcb5ccc1638fb1d16e53dc5994
          RELEASE root DER SHA256 pin: 91355cf1049a27aac52ea56f5ba1664054aded93500203cd23d557a710b0444c

          EXPECTED CURRENT GATE POLARITY
          - external-release-entry-qualification: SUCCESS
          - external-release-qualification: SUCCESS
          - external-release-merge-authority: FAILURE until separately signed HUMAN_RELEASE_AUTHORITY exists
          A successful independent review does NOT itself change the third check and does NOT grant merge authority.

          PRIOR REVIEW HISTORY
          A prior RELEASE review returned INSUFFICIENT_EVIDENCE. That is preserved as historical failure evidence. R2 then preregistered an evidence-closure matrix covering exact-SHA evidence, live App-bound ruleset state, immutable ancestry proof and negative vectors, checker provenance, harness/import isolation, complete qualification-contributing closure, mutable workflows/dependencies, bypass controls, authority separation, RELEASE-vs-PRODUCTION separation, and independently verifiable RED chronology.

          REQUIRED REVIEW OUTPUT
          Return one overall disposition from:
          - RELEASE_RULES_BOUNDED_PASS
          - CHANGES_REQUIRED
          - INSUFFICIENT_EVIDENCE

          Then enumerate every finding with: ID, severity (Critical/High/Medium/Low), materiality to RELEASE, exact evidence/reference, concrete false-green or governance path, whether it blocks candidate #37, and the minimum falsification/repair needed. Explicitly state whether the exact candidate may proceed to separate HUMAN_RELEASE_AUTHORITY consideration for MERGE_RELEASE_CANDIDATE. Do not grant that authority yourself. Separately identify production-only concerns that can legitimately defer.

          REVIEW DIMENSIONS
          1. Exact-SHA and TESTING->RELEASE ancestry binding.
          2. External checker independence, exact checker provenance and candidate inability to self-satisfy protected checks.
          3. Live phase/release ruleset target, strictness, bypass/force/delete/PR controls and App integration binding.
          4. Complete qualification-contributing source/test/helper/fixture/workflow/runtime closure.
          5. Adversarial harness/import/path isolation and command interception.
          6. Async/generator/async-generator/returned-awaitable false-green closure.
          7. Mutable actions/dependencies and reproducibility.
          8. RELEASE-scoped Ed25519 trust-root separation, authority-class/scope binding and signature verification.
          9. Policy ID/version/hash binding; stale-policy, stale-SHA, substitution and replay opportunities.
          10. Review-finding adjudication and terminal authority separation.
          11. RELEASE-vs-PRODUCTION boundary: no release evidence may silently grant production qualification/deploy authority.
          12. RELEASE-material configuration, migration/recovery, security, artifact reproducibility and resource/performance issues supported by this codebase.
          13. Preservation of historical RED evidence and whether later greens erase or bypass it.

          IMPORTANT NON-CLAIMS
          - phase/release has NOT been updated to this candidate.
          - candidate PR #37 is NOT authorized to merge.
          - external-release-merge-authority is intentionally failing.
          - no PRODUCTION qualification or deployment authority is claimed.
          - packet-generation tooling is non-authoritative and does not contribute to qualification.

          EOF

          append_file() {
            local label="$1" file="$2"
            if [ -f "$file" ]; then
              {
                printf '\n\n===== %s =====\n' "$label"
                cat "$file"
                printf '\n===== END %s =====\n' "$label"
              } >> "$OUT"
            fi
          }

          append_file 'LIVE RULESET JSON SNAPSHOT' ruleset.json
          append_file 'EXACT CANDIDATE CHECK-RUNS JSON SNAPSHOT' check-runs.json
          append_file 'PR #37 FULL DIFF' pr37.diff

          {
            printf '\n\n===== EXACT CANDIDATE COMMIT / ANCESTRY =====\n'
            git -C candidate show --no-patch --pretty=raw "$CANDIDATE_SHA"
            printf '\n--- ancestry from TESTING source to candidate ---\n'
            git -C candidate log --oneline --decorate --ancestry-path "${TESTING_SHA}..${CANDIDATE_SHA}"
            printf '\n--- merge-base ---\n'
            git -C candidate merge-base "$TESTING_SHA" "$CANDIDATE_SHA"
            printf '\n===== END EXACT CANDIDATE COMMIT / ANCESTRY =====\n'
          } >> "$OUT"

          # Candidate-side governance closure: include all text-like governance runtime material and release/testing workflows.
          while IFS= read -r file; do
            append_file "CANDIDATE:${file#candidate/}" "$file"
          done < <(find candidate/governance-runtime -type f \
                    \( -name '*.py' -o -name '*.md' -o -name '*.json' -o -name '*.txt' -o -name '*.yml' -o -name '*.yaml' \) \
                    ! -path '*/__pycache__/*' | sort)

          while IFS= read -r file; do
            append_file "CANDIDATE:${file#candidate/}" "$file"
          done < <(find candidate/.github/workflows -maxdepth 1 -type f \
                    \( -iname '*release*' -o -iname '*testing*' -o -iname '*qualification*' -o -iname '*governance*' \) | sort)

          # Checker-side exact main closure relevant to TESTING inheritance and RELEASE R1/R2/R3.
          while IFS= read -r file; do
            append_file "CHECKER:${file#checker-main/}" "$file"
          done < <(find checker-main/checker checker-main/evidence checker-main/history -type f \
                    \( -name '*.py' -o -name '*.md' -o -name '*.json' -o -name '*.txt' -o -name '*.yml' -o -name '*.yaml' -o -name '*.b64' \) \
                    ! -path '*/__pycache__/*' | sort)

          while IFS= read -r file; do
            append_file "CHECKER:${file#checker-main/}" "$file"
          done < <(find checker-main/.github/workflows -maxdepth 1 -type f \
                    \( -iname '*release*' -o -iname '*r10*' -o -iname '*r11*' -o -iname '*external*' \) | sort)

          {
            printf '\n\n===== PACKET INTEGRITY =====\n'
            printf 'candidate_sha=%s\n' "$CANDIDATE_SHA"
            printf 'testing_sha=%s\n' "$TESTING_SHA"
            printf 'release_base_sha=%s\n' "$RELEASE_BASE_SHA"
            printf 'checker_sha=%s\n' "$CHECKER_SHA"
            printf 'active_policy_sha256=%s\n' "$POLICY_HASH"
            printf 'packet_sha256='; sha256sum "$OUT" | awk '{print $1}'
            printf 'packet_bytes='; wc -c < "$OUT"
            printf '===== END PACKET INTEGRITY =====\n'
          } >> "$OUT"

          test -s "$OUT"
          wc -c "$OUT"

      - name: Upload plain-text packet
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-r3-full-independent-review-packet
          path: RELEASE-R3-FULL-INDEPENDENT-REVIEW-6d4fbb9c-DEEPSEEK.txt
          if-no-files-found: error
          retention-days: 7
