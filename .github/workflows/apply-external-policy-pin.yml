name: Apply external policy pin

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[external-pin-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin repaired candidate policy blob and version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('checker/falsify_candidate.py')
          s = p.read_text()
          old = 'EXPECTED_POLICY_BLOB_SHA = "23615ec522a234bf41216165cf368079a17f38cf"'
          new = 'EXPECTED_POLICY_BLOB_SHA = "019b89f32deba5a7bc93274ff41ad7e61a1aaad3"'
          if old not in s:
              raise SystemExit('expected old external policy pin not found')
          s = s.replace(old, new, 1)
          needle = 'policy = load_module(policy_path)\n\n        # R7-01:'
          replacement = 'policy = load_module(policy_path)\n        assert_equal(policy.POLICY_VERSION, 6, "externally pinned qualification policy version")\n\n        # R7-01:'
          if needle not in s:
              raise SystemExit('policy load anchor not found')
          p.write_text(s.replace(needle, replacement, 1))
          PY
      - name: Syntax check
        run: python -m py_compile checker/falsify_candidate.py
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/apply-external-policy-pin.yml
          git config user.name 'setugo-governance-construction'
          git config user.email '58181021+vij7661@users.noreply.github.com'
          git add -A
          git commit -m 'Pin R7 qualification policy v6 blob externally [external-pin-applied]'
          git push origin HEAD:main
