name: RELEASE Independent Review Adjudication Gate

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  publish-review-adjudication:
    runs-on: ubuntu-24.04
    environment: governance-app-publisher
    steps:
      - name: Checkout exact protected checker revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate protected checker revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]

      - name: Create governance App installation token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ secrets.SETUGO_GOVERNANCE_APP_ID }}
          private-key: ${{ secrets.SETUGO_GOVERNANCE_APP_PRIVATE_KEY }}
          owner: vij7661
          repositories: setugo-ai-development-framework

      - name: Verify independent RELEASE adjudication if present
        id: adjudication
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT='evidence/release-review-adjudication.json'
          SIGNATURE='evidence/release-review-adjudication.sig.b64'
          if [[ -f "$ARTIFACT" && -f "$SIGNATURE" ]]; then
            ARTIFACT_B64="$(base64 -w0 "$ARTIFACT")"
            SIGNATURE_B64="$(tr -d '\r\n' < "$SIGNATURE")"
          else
            ARTIFACT_B64=''
            SIGNATURE_B64=''
          fi
          python checker/verify_release_review_adjudication.py \
            --artifact-b64 "$ARTIFACT_B64" \
            --signature-b64 "$SIGNATURE_B64" \
            | tee release-review-adjudication-result.json

      - name: Publish dedicated independent-review App check
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          STEP_OUTCOME: ${{ steps.adjudication.outcome }}
          CANDIDATE_SHA: 4200397f21e12f900c309ee1bc66fa8424135f11
          CHECKER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$STEP_OUTCOME" == success ]]; then
            CONCLUSION=success
            TITLE='Independent RELEASE adjudication verified'
            DIGEST="$(jq -r '.adjudication_digest' release-review-adjudication-result.json)"
            SUMMARY="Checker ${CHECKER_SHA} verified signed independent RELEASE PASS adjudication for exact candidate ${CANDIDATE_SHA}; digest sha256:${DIGEST}. Evidence only; no terminal authority."
          else
            CONCLUSION=failure
            TITLE='Independent RELEASE adjudication absent or invalid'
            SUMMARY="Checker ${CHECKER_SHA} did not verify an eligible signed independent RELEASE PASS adjudication for exact candidate ${CANDIDATE_SHA}."
          fi
          jq -n \
            --arg name 'external-release-review-adjudication' \
            --arg head_sha "$CANDIDATE_SHA" \
            --arg external_id "$CHECKER_SHA" \
            --arg conclusion "$CONCLUSION" \
            --arg title "$TITLE" \
            --arg summary "$SUMMARY" \
            '{name:$name,head_sha:$head_sha,external_id:$external_id,status:"completed",conclusion:$conclusion,output:{title:$title,summary:$summary}}' > check.json
          RESPONSE="$(curl --fail-with-body -sS -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/vij7661/setugo-ai-development-framework/check-runs \
            -d @check.json)"
          printf '%s\n' "$RESPONSE" > published-check.json
          test "$(jq -r '.head_sha' published-check.json)" = "$CANDIDATE_SHA"
          test "$(jq -r '.external_id' published-check.json)" = "$CHECKER_SHA"
          test "$(jq -r '.app.id' published-check.json)" = '4895420'
          test "$(jq -r '.name' published-check.json)" = 'external-release-review-adjudication'
