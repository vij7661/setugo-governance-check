name: RELEASE R1 External Qualification

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-r1:
    runs-on: ubuntu-latest
    environment: governance-app-publisher
    steps:
      - name: Checkout exact checker
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate protected checker revision
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          printf 'checker_sha=%s\n' "$GITHUB_SHA"

      - name: Create governance App installation token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ secrets.SETUGO_GOVERNANCE_APP_ID }}
          private-key: ${{ secrets.SETUGO_GOVERNANCE_APP_PRIVATE_KEY }}
          owner: vij7661
          repositories: setugo-ai-development-framework

      - name: Execute RELEASE R3 successor external qualification
        id: qualify
        continue-on-error: true
        env:
          GOVERNANCE_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          python checker/falsify_candidate_release_r1.py \
            --repo vij7661/setugo-ai-development-framework \
            --sha 82782136fcbff465cddaf7b9832eafd2283fd892 | tee release-r3-result.txt

      - name: Publish RELEASE qualification evidence check
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          STEP_OUTCOME: ${{ steps.qualify.outcome }}
          SOURCE_SHA: 82782136fcbff465cddaf7b9832eafd2283fd892
          CHECKER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$STEP_OUTCOME" == success ]]; then
            CONCLUSION=success
            TITLE='External RELEASE qualification passed (evidence only)'
            SUMMARY="Checker ${CHECKER_SHA} satisfied frozen RELEASE external coverage for ${SOURCE_SHA}. Evidence only; no RELEASE terminal authority."
          else
            CONCLUSION=failure
            TITLE='External RELEASE qualification failed closed'
            SUMMARY="Checker ${CHECKER_SHA} rejected RELEASE candidate ${SOURCE_SHA}."
          fi
          jq -n \
            --arg name 'external-release-qualification' \
            --arg head_sha "$SOURCE_SHA" \
            --arg external_id "$CHECKER_SHA" \
            --arg conclusion "$CONCLUSION" \
            --arg title "$TITLE" \
            --arg summary "$SUMMARY" \
            '{name:$name,head_sha:$head_sha,external_id:$external_id,status:"completed",conclusion:$conclusion,output:{title:$title,summary:$summary}}' > check.json
          RESPONSE="$(curl --fail-with-body -sS -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/vij7661/setugo-ai-development-framework/check-runs \
            -d @check.json)"
          printf '%s\n' "$RESPONSE" > published-check.json
          test "$(jq -r '.head_sha' published-check.json)" = "$SOURCE_SHA"
          test "$(jq -r '.external_id' published-check.json)" = "$CHECKER_SHA"
          test "$(jq -r '.app.id' published-check.json)" = '4895420'
          test "$(jq -r '.name' published-check.json)" = 'external-release-qualification'

      - name: Require frozen RELEASE successor success
        env:
          STEP_OUTCOME: ${{ steps.qualify.outcome }}
        run: |
          set -euo pipefail
          [[ "$STEP_OUTCOME" == success ]] || exit 1
