name: RELEASE Entry Qualification

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-entry:
    runs-on: ubuntu-latest
    environment: governance-app-publisher
    steps:
      - name: Checkout exact external checker
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate checker revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          printf 'checker_sha=%s\n' "$GITHUB_SHA"

      - name: Create governance App installation token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ secrets.SETUGO_GOVERNANCE_APP_ID }}
          private-key: ${{ secrets.SETUGO_GOVERNANCE_APP_PRIVATE_KEY }}
          owner: vij7661
          repositories: setugo-ai-development-framework

      - name: Execute RELEASE entry checker and prove candidate lineage
        id: qualify
        continue-on-error: true
        shell: bash
        env:
          GOVERNANCE_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_SHA: 15d50cc25ae524fc64e2c65269c91135e0361846
          CANDIDATE_SHA: 4200397f21e12f900c309ee1bc66fa8424135f11
        run: |
          set -euo pipefail
          python checker/release_entry_qualification.py \
            --sha "$SOURCE_SHA" \
            --token "$GOVERNANCE_TOKEN" | tee release-entry-result.json

          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          git clone --filter=blob:none --no-checkout \
            https://github.com/vij7661/setugo-ai-development-framework.git "$TMP/candidate"
          git -C "$TMP/candidate" fetch --depth=256 origin "$SOURCE_SHA" "$CANDIDATE_SHA"
          git -C "$TMP/candidate" checkout --detach "$CANDIDATE_SHA"
          [[ "$(git -C "$TMP/candidate" rev-parse HEAD)" == "$CANDIDATE_SHA" ]]
          git -C "$TMP/candidate" merge-base --is-ancestor "$SOURCE_SHA" "$CANDIDATE_SHA"
          printf 'release_entry_source=%s\nrelease_candidate=%s\nlineage=verified\n' "$SOURCE_SHA" "$CANDIDATE_SHA"

      - name: Publish dedicated RELEASE-entry App check
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          STEP_OUTCOME: ${{ steps.qualify.outcome }}
          SOURCE_SHA: 15d50cc25ae524fc64e2c65269c91135e0361846
          CANDIDATE_SHA: 4200397f21e12f900c309ee1bc66fa8424135f11
          CHECKER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$STEP_OUTCOME" == "success" ]]; then
            CONCLUSION=success
            TITLE='External RELEASE entry qualification passed (evidence only)'
            SUMMARY="Checker ${CHECKER_SHA} verified RELEASE-entry source ${SOURCE_SHA} and ancestry into exact candidate ${CANDIDATE_SHA}. Evidence only; no RELEASE terminal authority."
          else
            CONCLUSION=failure
            TITLE='External RELEASE entry qualification failed closed'
            SUMMARY="Checker ${CHECKER_SHA} could not establish frozen RELEASE-entry qualification and lineage for ${CANDIDATE_SHA}. phase/release must not advance."
          fi
          jq -n \
            --arg name 'external-release-entry-qualification' \
            --arg head_sha "$CANDIDATE_SHA" \
            --arg external_id "$CHECKER_SHA" \
            --arg conclusion "$CONCLUSION" \
            --arg title "$TITLE" \
            --arg summary "$SUMMARY" \
            '{name:$name,head_sha:$head_sha,external_id:$external_id,status:"completed",conclusion:$conclusion,output:{title:$title,summary:$summary}}' > check.json
          RESPONSE="$(curl --fail-with-body -sS -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/vij7661/setugo-ai-development-framework/check-runs \
            -d @check.json)"
          printf '%s\n' "$RESPONSE" > published-check.json
          test "$(jq -r '.head_sha' published-check.json)" = "$CANDIDATE_SHA"
          test "$(jq -r '.external_id' published-check.json)" = "$CHECKER_SHA"
          test "$(jq -r '.app.id' published-check.json)" = '4895420'
          test "$(jq -r '.name' published-check.json)" = 'external-release-entry-qualification'

      - name: Require checker success
        env:
          STEP_OUTCOME: ${{ steps.qualify.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$STEP_OUTCOME" == success ]] || {
            echo 'RELEASE entry remains blocked by frozen checker or lineage proof.' >&2
            exit 1
          }
