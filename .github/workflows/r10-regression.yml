name: R10 External Governance Regression

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    environment: governance-app-publisher
    strategy:
      fail-fast: false
      matrix:
        include:
          - candidate_sha: 4d8d40acf622243f64c54c04481c4807040557d1
            expected: failure
            case_id: R10-A
          - candidate_sha: 2b69938815e1cd57300bc196d5f8dc18870bc378
            expected: failure
            case_id: R10-B
          - candidate_sha: 72b53625a2a5cc9498a7455203b3028cedf86505
            expected: success
            case_id: R11-CANDIDATE-HEAD
    steps:
      - name: Checkout external checker
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate checker main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          printf 'checker_sha=%s\n' "$GITHUB_SHA"

      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ secrets.SETUGO_GOVERNANCE_APP_ID }}
          private-key: ${{ secrets.SETUGO_GOVERNANCE_APP_PRIVATE_KEY }}
          owner: vij7661
          repositories: setugo-ai-development-framework

      - name: Run external falsifier
        id: falsify
        continue-on-error: true
        shell: bash
        env:
          GOVERNANCE_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          python checker/falsify_candidate_r10_entry.py \
            --repo vij7661/setugo-ai-development-framework \
            --sha '${{ matrix.candidate_sha }}' | tee result.json

      - name: Publish external qualification check
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SHA: ${{ matrix.candidate_sha }}
          STEP_OUTCOME: ${{ steps.falsify.outcome }}
          CHECKER_SHA: ${{ github.sha }}
          CASE_ID: ${{ matrix.case_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$STEP_OUTCOME" == "success" ]]; then
            CONCLUSION=success
            TITLE="External governance falsification passed (${CASE_ID}; evidence only)"
            SUMMARY="External checker ${CHECKER_SHA} completed frozen ${CASE_ID}. Evidence only; no terminal authority."
          else
            CONCLUSION=failure
            TITLE="External governance falsification failed closed (${CASE_ID})"
            SUMMARY="External checker ${CHECKER_SHA} rejected frozen ${CASE_ID}. TESTING authority unchanged."
          fi

          jq -n \
            --arg name 'external-governance-qualification' \
            --arg head_sha "$SHA" \
            --arg external_id "$CHECKER_SHA" \
            --arg conclusion "$CONCLUSION" \
            --arg title "$TITLE" \
            --arg summary "$SUMMARY" \
            '{name:$name, head_sha:$head_sha, external_id:$external_id, status:"completed", conclusion:$conclusion, output:{title:$title, summary:$summary}}' \
            > check.json

          curl --fail-with-body -sS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/vij7661/setugo-ai-development-framework/check-runs \
            -d @check.json

      - name: Assert expected regression outcome
        env:
          ACTUAL: ${{ steps.falsify.outcome }}
          EXPECTED: ${{ matrix.expected }}
          CASE_ID: ${{ matrix.case_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ACTUAL" == "$EXPECTED" ]] || {
            echo "${CASE_ID}: expected ${EXPECTED}, got ${ACTUAL}" >&2
            exit 1
          }
          echo "${CASE_ID}: expected outcome observed (${ACTUAL})"
